# Laboratório Qdrant — Seminário NoSQL (Tema 17)
# Sobe o Qdrant com API REST (6333), gRPC (6334) e painel web em http://localhost:6333/dashboard
services:
  qdrant:
    image: qdrant/qdrant:v1.20.2
    container_name: qdrant-lab
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API + Web UI (dashboard)
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage   # dados persistem entre reinícios
    environment:
      QDRANT__LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  qdrant_storage:
