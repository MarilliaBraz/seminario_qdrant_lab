# Parâmetros do laboratório (CONVENTIONS.md §2.3: nada que pode variar fica fixo no código).
# Toda chave pode ser trocada por variável de ambiente: maiúsculas, com "." e "-" virando "_".
# Exemplo: QDRANT_HOST=192.168.0.10 java -jar target/qdrant-lab.jar demo

# Conexão com o Qdrant (gRPC)
qdrant.host=localhost
qdrant.porta-grpc=6334
qdrant.url-painel=http://localhost:6333/dashboard

# Coleção e índice HNSW
qdrant.colecao=produtos
qdrant.hnsw.m=16
qdrant.hnsw.ef-construct=100

# Modelo de embedding (ONNX, baixado por ./baixar_modelo.sh)
modelo.pasta=modelo
modelo.dimensao=384

# Catálogo de produtos carregado no INSERT em lote
dados.arquivo-produtos=dados/produtos.json

# Regras padrão dos comandos
busca.limite-padrao=3
atualizacao.desconto-padrao=0.20
atualizacao.baixa-estoque-padrao=5
